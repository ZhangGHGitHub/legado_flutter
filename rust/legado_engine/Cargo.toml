[package]
name = "legado_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "deflate",
    "brotli",
    "rustls-tls",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
url = "2"
jsonpath-rust = "0.7"
once_cell = "1"
thiserror = "2"
log = "0.4"
flate2 = "1"
