[package]
name = "legado_engine"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
flutter_rust_bridge = "=2.11.1"
reqwest = { version = "0.12", default-features = false, features = [
    "gzip",
    "deflate",
    "brotli",
    "rustls-tls",
    "socks",
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
axum = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors"] }
scraper = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
encoding_rs = "0.8"
url = "2"
jsonpath-rust = "0.7"
once_cell = "1"
thiserror = "2"
log = "0.4"
flate2 = "1"
rquickjs = "0.12.1"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
ecb = { version = "0.1", features = ["alloc"] }
base64 = "0.22"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
legado_webdav = { path = "../legado-webdav" }

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "rule_bench"
harness = false
