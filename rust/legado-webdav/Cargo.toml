[package]
name = "legado_webdav"
version = "0.1.0"
edition = "2021"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
thiserror = "2"
url = "2"
base64 = "0.22"
httpdate = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
