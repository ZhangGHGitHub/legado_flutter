name: Continuous Integration

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Flutter, Rust and architecture checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Generate Dart models
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Flutter analyze
        run: flutter analyze --no-pub

      - name: Flutter tests (serial)
        run: flutter test --no-pub --concurrency=1

      - name: Rust legado_engine tests
        working-directory: rust
        run: cargo test -p legado_engine --locked

      - name: Architecture boundary check
        run: pwsh -NoProfile -File scripts/check_architecture_boundaries.ps1 -Root "$PWD"

      - name: Check diff whitespace
        run: git diff --check
