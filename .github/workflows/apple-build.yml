name: Apple Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      # checkout@v5 / upload-artifact@v6 run on Node 24 (v4 Node 20 is deprecated)
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Apple Rust targets
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Flutter pub get
        run: flutter pub get

      - name: Precache Flutter macOS/iOS
        run: flutter precache --macos --ios

      - name: Build macOS
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build_macos.log

      - name: Upload macOS build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: macos-build-log
          path: build_macos.log

      - name: Build iOS (simulator, no codesign)
        run: |
          set -o pipefail
          # rquickjs has no prebuilt bindings for aarch64-apple-ios-sim; compile via bindgen.
          sed -i.bak 's/rquickjs = "0.12.1"/rquickjs = { version = "0.12.1", features = ["bindgen"] }/' rust/legado_engine/Cargo.toml
          flutter build ios --simulator --no-codesign 2>&1 | tee build_ios.log
          mv rust/legado_engine/Cargo.toml.bak rust/legado_engine/Cargo.toml

      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: ios-build-log
          path: build_ios.log
