name: Apple Build

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Apple Rust targets
        run: |
          rustup target add \
            aarch64-apple-darwin \
            x86_64-apple-darwin \
            aarch64-apple-ios \
            aarch64-apple-ios-sim \
            x86_64-apple-ios

      - name: Flutter pub get
        run: flutter pub get

      - name: Precache Flutter macOS/iOS
        run: flutter precache --macos --ios

      - name: Build macOS
        run: |
          set -o pipefail
          flutter build macos --release 2>&1 | tee build_macos.log

      - name: Upload macOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build_macos.log

      - name: Build iOS (simulator, no codesign)
        run: |
          set -o pipefail
          flutter build ios --release --simulator --no-codesign 2>&1 | tee build_ios.log

      - name: Upload iOS build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: build_ios.log
